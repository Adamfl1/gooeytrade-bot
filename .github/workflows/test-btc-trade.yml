name: Test BTC/USD Trade + SL/TP

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no real trade)'
        required: false
        default: true
        type: boolean

env:
  DRY_RUN: ${{ github.event.inputs.dry_run != 'false' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Decode session files
        run: |
          if [ -n "${{ secrets.TV_SESSION_BASE64 }}" ]; then
            echo "${{ secrets.TV_SESSION_BASE64 }}" | base64 -d > tv_session.json
            echo "TV session decoded"
          fi
          if [ -n "${{ secrets.GOOEYTRADE_SESSION_BASE64 }}" ]; then
            echo "${{ secrets.GOOEYTRADE_SESSION_BASE64 }}" | base64 -d > session.json
            echo "GooeyTrade session decoded"
          fi

      - name: Run BTC/USD test
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            python test_btc_trade.py
          else
            python test_btc_trade.py --dry-run
          fi
        env:
          TV_CHART_URL: ${{ secrets.TV_CHART_URL }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-test-screenshots
          path: debug_*.png

      - name: Commit state
        if: always()
        run: |
          git config user.name "gooeytrade-bot"
          git config user.email "gooeytrade-bot@local"
          git add bot_state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "test: BTC/USD trade $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || true
