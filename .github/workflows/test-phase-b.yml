name: Test Phase B (SL/TP)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'run.py'
      - 'execution.py'
      - 'state.py'
      - 'tv_scraper.py'
      - 'test_phase_b_live.py'
      - '.github/workflows/test-phase-b.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Decode session files
        run: |
          if [ -n "${{ secrets.TV_SESSION_BASE64 }}" ]; then
            echo "${{ secrets.TV_SESSION_BASE64 }}" | base64 -d > tv_session.json
          fi
          if [ -n "${{ secrets.GOOEYTRADE_SESSION_BASE64 }}" ]; then
            echo "${{ secrets.GOOEYTRADE_SESSION_BASE64 }}" | base64 -d > session.json
          fi

      - name: Test Phase B - LIVE (scrape TV labels → apply to open position)
        run: python test_phase_b_live.py
        env:
          TV_CHART_URL: ${{ secrets.TV_CHART_URL }}
          DRY_RUN: 'false'

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-b-live-screenshots
          path: |
            debug_phase_b_*.png
            debug_ocr_crop.png
            debug_tv_screenshot.png
          if-no-files-found: ignore

      - name: Commit test result
        if: always()
        run: |
          git config user.name "gooeytrade-bot"
          git config user.email "gooeytrade-bot@local"
          [ -f phase_b_test_result.json ] && git add phase_b_test_result.json || true
          git diff --staged --quiet || git commit -m "test: phase B result $(date -u %Y-%m-%dT%H:%M:%SZ)"
          git push || true
